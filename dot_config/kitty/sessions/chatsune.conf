# Tab 1: Deployment
new_tab Chatsune Deployment
layout splits
cd ~/Nextcloud/chatsune-local

launch --cwd ~/Nextcloud/chatsune-local fish

launch --cwd ~ --location hsplit fish

# Tab 2: Dev Launch
new_tab Chatsune Dev Launch
layout splits
cd ~/workspace/chatsune

launch --cwd ~/workspace/chatsune fish -c 'docker compose up -d && ./start-backend.sh; fish'

launch --cwd ~/workspace/chatsune --location hsplit fish -c './start-frontend.sh; fish'

# Tab 3: Dev (tall layout, master unten)
new_tab Chatsune Dev
layout fat:mirrored=true
cd ~/workspace/chatsune

launch --cwd ~/workspace/chatsune fish -c 'cc; fish'

launch --cwd ~/workspace/chatsune --location vsplit fish

launch --cwd ~/workspace/chatsune --location vsplit fish

