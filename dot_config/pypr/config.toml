[pyprland]
plugins = ["scratchpads", "layout_center"]

[layout_center]
margin = 75
offset = [0, 30]
next = "movefocus r"
prev = "movefocus l"
next2 = "movefocus d"
prev2 = "movefocus u"

[scratchpads.pavucontrol]
command = "pavucontrol"
size = "60% 40%"
position = "20% 30%"
class = "org.pulseaudio.pavucontrol"
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.qalculate]
command = "exec qalculate-gtk"
size = "40% 40%"
position = "30% 30%"
class = "qalculate-gtk"
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.orage]
command = "orage"
size = "30% 30%"
position = "35% 35%"
class = "orage"
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.keychron]
command = "chromium --app='https://launcher.keychron.com' --no-default-browser-check --no-first-run"
size = "90% 90%"
position = "5% 5%"
match_by = "class"
class = "chrome-launcher.keychron.com__-Default"
process_tracking = false

[scratchpads.grok]
command = "chromium 'https://grok.com' --class='chrome-grok.com__-Default' --new-window"
size = "90% 90%"
position = "5% 5%"
match_by = "class"
class = "chrome-grok.com__-Default"
#process_tracking = false

[scratchpads.claude]
animation = ""
command = "claude-desktop"
size = "90% 90%"
position = "5% 5%"
class = "Claude"
restore_excluded = false
lazy = false
alt_toggle = true
multi = false
