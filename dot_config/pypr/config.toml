[pyprland]
plugins = ["scratchpads", "layout_center"]

[layout_center]
margin = 75
offset = [0, 30]
next = "movefocus r"
prev = "movefocus l"
next2 = "movefocus d"
prev2 = "movefocus u"

[scratchpads.pavucontrol]
command = "pavucontrol"
size = "60% 40%"
position = "20% 30%"
class = "org.pulseaudio.pavucontrol"
excludes = ["*"]
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.qalculate]
command = "qalculate-gtk"
size = "40% 40%"
position = "30% 30%"
class = "qalculate-gtk"
excludes = ["*"]
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.orage]
command = "orage"
size = "30% 30%"
position = "35% 35%"
class = "orage"
excludes = ["*"]
restore_excluded = false
lazy = false
alt_toggle = true
multi = false

[scratchpads.keychron]
command = "chromium --class='chrome-keychron-launcher' --disable-first-run-ui --disable-default-browser-promo https://launcher.keychron.com"
size = "90% 90%"
position = "5% 5%"
class = "chrome-keychron-launcher"
excludes = ["*"]
restore_excluded = false
lazy = false
alt_toggle = true
multi = false
